<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Infinity Traders</title>
  <meta name="description" content="Sign in to Infinity Traders Retail Billing and Inventory Management System.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%232457D6'/><text y='.9em' font-size='60' x='8' fill='%23D4AF37'>∞</text></svg>">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary: #2457D6;
      --primary-hover: #1b45ab;
      --navy: #14213D;
      --navy-light: #1f3158;
      --gold: #D4AF37;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --card-bg: #FFFFFF;
      --bg-page: #F1F5F9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(36, 87, 214, 0.08) 0%, rgba(20, 33, 61, 0.05) 90%), #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--text-dark);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--navy) 100%);
      color: var(--gold);
      font-size: 36px;
      font-weight: 700;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(36, 87, 214, 0.35);
      margin-bottom: 16px;
      user-select: none;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px -15px rgba(20, 33, 61, 0.07);
    }

    .login-heading {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .login-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #94A3B8;
      font-size: 16px;
      pointer-events: none;
    }

    .form-control-custom {
      width: 100%;
      height: 46px;
      padding: 10px 42px 10px 40px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-dark);
      background-color: #FAFAFA;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.15);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .toggle-password:hover {
      color: var(--navy);
    }

    .btn-login {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px -2px rgba(36, 87, 214, 0.3);
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -2px rgba(36, 87, 214, 0.4);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .demo-credentials-box {
      margin-top: 24px;
      padding: 14px;
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: 10px;
      font-size: 12px;
      color: #475569;
    }

    .demo-credentials-box strong {
      color: var(--navy);
    }

    .alert-custom {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }

    .alert-danger-custom {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
    }
  </style>
</head>
<body>

<div class="login-container">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-badge">∞</div>
    <h1 class="brand-title">INFINITY TRADERS</h1>
    <div class="brand-subtitle">Retail Billing &amp; Inventory Management</div>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <h2 class="login-heading">Sign In</h2>
    <p class="login-desc">Enter your credentials to access the system</p>

    <!-- Error Alert -->
    <div id="login-alert" class="alert-custom alert-danger-custom" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="login-alert-text">Invalid username or password</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" id="username" name="username" class="form-control-custom" placeholder="e.g. admin" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Show password">
            <i class="bi bi-eye" id="toggle-password-icon"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me" checked>
          <label class="form-check-label text-muted" for="remember-me" style="font-size:13px">Remember this session</label>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-submit-btn">
        <span>Sign In</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

  </div>
</div>

<script>
  // Check if user is already logged in
  (async function checkExistingAuth() {
    try {
      const res = await fetch('api/auth/me.php');
      if (res.ok) {
        const data = await res.json();
        if (data && data.success) {
          window.location.href = 'index.html';
        }
      }
    } catch (e) {
      // Not logged in or server starting, continue on login page
    }
  })();

  // Toggle password visibility
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-password-btn');
  const toggleIcon = document.getElementById('toggle-password-icon');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
  });

  // Handle Login submission
  const loginForm = document.getElementById('login-form');
  const submitBtn = document.getElementById('login-submit-btn');
  const alertBox = document.getElementById('login-alert');
  const alertText = document.getElementById('login-alert-text');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      alertText.textContent = 'Please enter both username and password.';
      alertBox.style.display = 'flex';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';

    try {
      const res = await fetch('api/auth/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        window.location.href = 'index.html';
      } else {
        alertText.textContent = data.error || 'Invalid username or password.';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span> <i class="bi bi-arrow-right"></i>';
      }
    } catch (err) {
      alertText.textContent = 'Unable to connect to server. Ensure Apache & MySQL are running.';
      alertBox.style.display = 'flex';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Sign In</span> <i class="bi bi-arrow-right"></i>';
    }
  });
</script>

</body>
</html>
